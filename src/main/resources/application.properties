# Nombre de la aplicación
spring.application.name=sistemadeviajes

# Puerto del servidor
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.content-type=text/html

# Formato de logs
logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false

# Mensaje de prueba
index.saludo=Adios desde application.properties

# Conexión a MySQL (válido para MySQL 8.x y 9.x) si esta en otro servidor cambiamos la version-- incluir nombre de la base de datos
#no 
spring.datasource.url=jdbc:mysql://localhost:3306/sistemaDeViajesBD?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=j001
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#driver

# Dialecto de Hibernate (corregido)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Consola: configuración de logs SQL
spring.jpa.properties.hibernate.format_sql=true 
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#lengiaje de definicion de datos-la entidad la tome y le cree en la base de datos
spring.jpa.hibernate.ddl-auto=update