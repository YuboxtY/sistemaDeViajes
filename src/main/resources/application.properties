# Nombre de la aplicación
spring.application.name=sistemadeviajes

# Puerto personalizado
server.port=9090

# Configuración de Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.content-type=text/html
spring.thymeleaf.cache=false

# Banner y logs
spring.main.banner-mode=off
logging.pattern.dateformat=hh:mm

# Conexión a base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/sistemaDeViajesBD?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=j001
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto y configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Logs SQL detallados
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mensaje de prueba
index.saludo=Adios desde application.properties
