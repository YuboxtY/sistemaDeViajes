<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${unidad?.placa != null} ? 'Editar Unidad' : 'Agregar Unidad'">Formulario Unidad</title>
</head>
<body>
<h1 th:text="${unidad?.placa != null} ? 'Editar Unidad' : 'Agregar Unidad'">Formulario</h1>

<form th:action="@{/unidades/guardar}" method="post" th:object="${unidad}">
  <!-- Campo oculto para placa -->
  <input type="hidden" th:field="*{placa}" th:if="${unidad?.placa != null}">

  <!-- Mostrar campo placa solo cuando se está creando -->
  <div th:unless="${unidad?.placa != null}">
    <label for="placa">Placa:</label>
    <input type="text" id="placa" th:field="*{placa}" required maxlength="10">
  </div>

  <div>
    <label for="modelo">Modelo:</label>
    <input type="text" id="modelo" th:field="*{modelo}" required>
  </div>

  <div>
    <label for="capacidad">Capacidad:</label>
    <input type="number" id="capacidad" th:field="*{capacidad}" required>
  </div>

  <div>
    <label for="estado">Estado:</label>
    <select id="estado" th:field="*{estado}" required>
      <option value="Disponible">Disponible</option>
      <option value="Asignada">Asignada</option>
      <option value="EnMantenimiento">En Mantenimiento</option>
    </select>
  </div>

  <button type="submit">Guardar</button>
  <a th:href="@{/unidades/list}">Cancelar</a>
</form>
</body>
</html>
