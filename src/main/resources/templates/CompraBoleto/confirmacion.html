<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compra Exitosa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .qr-image {
            max-width: 200px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">
<header th:replace="layout/plantilla :: header"></header>

<div class="container py-5">
    <div class="text-center">
        <h2 class="text-success mb-4">🎉 ¡Gracias por su compra!</h2>
        <p class="lead">Su boleto ha sido registrado exitosamente. Escanee este código QR para ver su ticket:</p>

        <!-- QR generado -->
        <img th:src="@{${qrImage}}" alt="Código QR del boleto" class="qr-image" />

        <!-- Resumen del boleto -->
        <div class="card mt-4 text-start mx-auto" style="max-width: 500px;">
            <div class="card-header bg-primary text-white">
                Resumen del Boleto
            </div>
            <div class="card-body">
                <p><strong>Cédula:</strong> <span th:text="${boleto.usuario.cedula}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${boleto.usuario.nombre}"></span></p>
                <p><strong>Email:</strong> <span th:text="${boleto.usuario.email}"></span></p>
                <hr>
                <p><strong>Ruta:</strong> <span th:text="${boleto.turno.ruta.origen} + ' → ' + ${boleto.turno.ruta.destino}"></span></p>
                <p><strong>Fecha:</strong> <span th:text="${boleto.turno.fecha}"></span></p>
                <p><strong>Hora:</strong> <span th:text="${#temporals.format(boleto.turno.hora, 'hh:mm a')}"></span></p>
                <hr>
                <p><strong>Cantidad de Asientos:</strong> <span th:text="${cantidadAsientos}"></span></p>
                <p><strong>Total Pagado:</strong> $<span th:text="${boleto.total}"></span></p>
            </div>
        </div>

        <!-- Botón volver -->
        <a th:href="@{/}" class="btn btn-outline-primary mt-4">Volver al Menú Principal</a>
    </div>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>
</body>
</html>
