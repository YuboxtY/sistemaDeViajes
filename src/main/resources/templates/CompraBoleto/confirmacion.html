<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compra Exitosa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .qr-image {
            max-width: 250px;
        }
        .resumen-card {
            width: 100%;
            max-width: 350px;
        }
    </style>
</head>
<body class="bg-light">
<header th:replace="layout/plantilla :: header"></header>

<div class="container py-5">
    <!-- Mensaje principal centrado -->
    <div class="row justify-content-center text-center mb-4">
        <div class="col-md-8">
            <h2 class="text-success">🎉 ¡Gracias por su compra!</h2>
            <p class="lead">Su boleto ha sido registrado exitosamente. Escanee este código QR para ver su ticket:</p>
        </div>
    </div>

    <!-- Contenido: resumen y QR alineados horizontalmente -->
    <div class="row justify-content-center align-items-start g-5 text-start">
        <!-- Columna 1: Resumen del boleto -->
        <div class="col-md-auto">
            <div class="card resumen-card">
                <div class="card-header bg-primary text-white">Resumen del Boleto</div>
                <div class="card-body">
                    <p><strong>Cédula:</strong> <span th:text="${boleto.usuario.cedula}"></span></p>
                    <p><strong>Nombre:</strong> <span th:text="${boleto.usuario.nombre}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${boleto.usuario.email}"></span></p>
                    <hr>
                    <p><strong>Ruta:</strong> <span th:text="${boleto.turno.ruta.origen} + ' → ' + ${boleto.turno.ruta.destino}"></span></p>
                    <p><strong>Fecha de Compra:</strong><span th:text="${#dates.format(boleto.fechaCompra, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Hora:</strong> <span th:text="${#temporals.format(boleto.turno.hora, 'hh:mm a')}"></span></p>
                    <hr>
                    <p><strong>Cantidad de Asientos:</strong> <span th:text="${cantidadAsientos}"></span></p>
                    <p><strong>Total Pagado:</strong> $<span th:text="${boleto.total}"></span></p>
                </div>
            </div>
        </div>

        <!-- Columna 2: QR -->
        <div class="col-md-auto d-flex align-items-center">
            <img th:src="@{${qrImage}}" alt="Código QR del boleto" class="qr-image mx-auto" />
        </div>
    </div>

    <!-- Botón volver -->
    <div class="text-center mt-5">
        <a th:href="@{/user-web/index}" class="btn btn-outline-primary">Volver al Menú Principal</a>
    </div>
    <!-- Botón para imprimir factura -->
    <a th:href="@{'/CompraBoleto/factura/' + ${turno.id}}"
       class="btn btn-outline-success"
       target="_blank">
        Imprimir Factura
    </a>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>
</body>
</html>
