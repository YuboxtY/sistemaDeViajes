<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turnos Disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .turno-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 20px 25px;
            margin-bottom: 30px;
        }

        .ruta-linea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .info-lado {
            width: 30%;
            text-align: center;
        }

        .origen, .destino {
            font-weight: 600;
            color: #555;
        }

        .hora {
            font-size: 0.95rem;
            color: #333;
        }

        .fecha {
            font-size: 0.85rem;
            color: #777;
        }

        .puntos-linea {
            position: relative;
            height: 30px;
            width: 100%;
        }

        .puntos-linea::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 2px;
            background-color: #0d6efd;
        }

        .punto {
            width: 8px;
            height: 8px;
            background-color: #0d6efd;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .punto.inicio {
            left: 10px;
        }

        .punto.fin {
            right: 10px;
        }

        .top-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .boton-compra {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body class="bg-light">

<header th:replace="layout/plantilla :: header"></header>

<div class="container py-4">
    <h4 class="text-center text-primary mb-4">Turnos Disponibles</h4>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tarjetas de turnos -->
    <div th:each="turno : ${turnos}" class="turno-card">

        <!-- Hora y Disponibilidad -->
        <div class="top-info">
            <div class="hora">
                <strong>Hora:</strong>
                <span th:text="${#temporals.format(turno.hora, 'hh:mm a')}">09:00 AM</span>
            </div>

            <div class="text-end">
                <strong>Disponibles:</strong>
                <span th:if="${disponiblesPorTurno[turno.id] == 0}"
                      class="text-danger fw-bold"
                      th:text="${disponiblesPorTurno[turno.id]}">0</span>

                <span th:if="${disponiblesPorTurno[turno.id] > 0 and disponiblesPorTurno[turno.id] < 5}"
                      class="text-warning fw-semibold"
                      th:text="${disponiblesPorTurno[turno.id]}">1</span>

                <span th:if="${disponiblesPorTurno[turno.id] >= 5}"
                      class="text-success"
                      th:text="${disponiblesPorTurno[turno.id]}">10</span>
            </div>
        </div>

        <!-- Ruta -->
        <div class="ruta-linea">
            <div class="info-lado text-start">
                <div class="origen" th:text="${turno.ruta.origen + ' (ECU)'}">Nabón (ECU)</div>
            </div>
            <div class="puntos-linea">
                <div class="punto inicio"></div>
                <div class="punto fin"></div>
            </div>
            <div class="info-lado text-end">
                <div class="destino" th:text="${turno.ruta.destino + ' (ECU)'}">Cuenca (ECU)</div>
                <div class="fecha" th:text="${#temporals.format(turno.fecha, 'dd MMM yyyy')}">24 Feb 2023</div>
            </div>
        </div>

        <!-- Botón comprar -->
        <div class="boton-compra">
            <a th:href="@{/CompraBoleto/nuevo(turnoId=${turno.id})}"
               class="btn btn-primary btn-sm"
               th:classappend="${disponiblesPorTurno[turno.id]} == 0 ? ' disabled' : ''"
               th:attr="aria-disabled=${disponiblesPorTurno[turno.id]} == 0"
               th:text="${disponiblesPorTurno[turno.id]} == 0 ? 'Sin Asientos' : 'Comprar'">
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="btn btn-outline-secondary">← Regresar</a>
    </div>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>
</body>
</html>
