<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Turnos Disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<header th:replace="layout/plantilla :: header"></header>
<div class="container py-5">
    <h2 class="text-center text-primary mb-4">Turnos Disponibles</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="turno : ${turnos}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${turno.ruta.origen} + ' → ' + ${turno.ruta.destino}">Ruta</h5>
                    <p class="card-text">
                        <strong>Unidad:</strong> <span th:text="${turno.unidad.placa}"></span><br>
                        <strong>Fecha:</strong> <span th:text="${turno.fecha}"></span><br>
                        <strong>Hora:</strong> <span th:text="${turno.hora}"></span><br>
                        <strong>Asientos disponibles:</strong>
                        <span th:text="${disponiblesPorTurno[turno.id]}"></span>
                    </p>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/boletos/nuevo(turnoId=${turno.id})}" class="btn btn-success">Usar</a>
                        <a th:href="@{/}" class="btn btn-secondary">Regresar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="layout/plantilla :: footer"></footer>
</body>
</html>
