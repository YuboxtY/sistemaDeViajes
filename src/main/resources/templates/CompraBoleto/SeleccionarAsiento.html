<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seleccionar Asientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .seat-icon {
      width: 40px;
      height: 40px;
    }

    .seat {
      width: 45px;
      height: 45px;
      margin: 3px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .seat-container {
      background: #f2f2f2;
      padding: 30px;
      border-radius: 15px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px 15px;
      justify-items: center;
    }

    .disabled-seat img {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .aisle-space {
      width: 20px;
    }
  </style>
</head>
<body class="bg-light">
<header th:replace="layout/plantilla :: header"></header>

<div class="container py-5">
  <h2 class="mb-4 text-center text-primary">Selecciona tus Asientos</h2>

  <form th:action="@{/CompraBoleto/reservar}" method="post" id="asientosForm">
    <input type="hidden" name="turnoId" th:value="${turno.id}" />

    <div class="row">
      <div class="col-md-7">
        <div class="bg-light p-3 rounded">
          <div th:if="${asientos != null}">
            <div th:each="fila : ${#numbers.sequence(0, filas - 1)}" class="d-flex justify-content-center mb-3">

              <!-- Lado izquierdo -->
              <div class="d-flex">
                <div th:each="i : ${#numbers.sequence(0,1)}"
                     th:if="${fila * 4 + i < asientos.size()}"
                     th:with="asiento=${asientos[fila * 4 + i]}">
                  <label th:class="'seat ' + (${asiento.estado != 'disponible' ? 'disabled-seat' : ''})"
                         style="margin-right: 10px;">
                    <input type="checkbox" name="asientosSeleccionados"
                           th:value="${asiento.idAsiento}"
                           class="form-check-input d-none"
                           th:disabled="${asiento.estado != 'disponible'}" />
                    <div th:with="imgFile=${asiento.estado == 'disponible' ? 'seat.png' :
                                         (asiento.estado == 'reservado' ? 'seat-reservado.png' : 'seat-no-disponible.png')}">
                      <img th:src="@{'/images/' + ${imgFile}}"
                           th:attr="data-estado=${asiento.estado}"
                           class="seat-icon" />
                    </div>
                  </label>
                </div>
              </div>

              <!-- Espacio pasillo -->
              <div class="aisle-space mx-2"></div>

              <!-- Lado derecho -->
              <div class="d-flex">
                <div th:each="j : ${#numbers.sequence(2,3)}"
                     th:if="${fila * 4 + j < asientos.size()}"
                     th:with="asiento=${asientos[fila * 4 + j]}">
                  <label th:class="'seat ' + (${asiento.estado != 'disponible' ? 'disabled-seat' : ''})"
                         style="margin-left: 10px;">
                    <input type="checkbox" name="asientosSeleccionados"
                           th:value="${asiento.idAsiento}"
                           class="form-check-input d-none"
                           th:disabled="${asiento.estado != 'disponible'}" />
                    <div th:with="imgFile=${asiento.estado == 'disponible' ? 'seat.png' :
                                         (asiento.estado == 'reservado' ? 'seat-reservado.png' : 'seat-no-disponible.png')}">
                      <img th:src="@{'/images/' + ${imgFile}}"
                           th:attr="data-estado=${asiento.estado}"
                           class="seat-icon" />
                    </div>
                  </label>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Panel lateral resumen -->
      <div class="col-md-5">
        <div class="info-card bg-white p-4 rounded shadow-sm">
          <h5 class="text-muted mb-3">Resumen del Turno</h5>
          <p><strong>Origen:</strong> <span th:text="${turno.ruta.origen}"></span></p>
          <p><strong>Destino:</strong> <span th:text="${turno.ruta.destino}"></span></p>
          <p><strong>Fecha:</strong> <span th:text="${turno.fecha}"></span></p>
          <p><strong>Hora:</strong> <span th:text="${#temporals.format(turno.hora, 'hh:mm a')}"></span></p>
          <hr>
          <p><strong>Precio por asiento:</strong> $<span id="precioUnitario" th:text="${precioUnitario}">0.00</span></p>
          <p><strong>Asientos seleccionados:</strong> <span id="cantidad">0</span></p>
          <h5 class="mt-3">Total: $<span id="total">0.00</span></h5>

          <button type="submit" id="btnComprar" class="btn btn-success w-100 mt-3" disabled>Comprar</button>
          <a th:href="@{/CompraBoleto/listarTurnos}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </div>
      </div>
    </div>
  </form>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>

<!-- ✅ JS para manejar cambio de imágenes -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const precioUnitario = parseFloat(document.getElementById('precioUnitario').textContent);
    const cantidadSpan = document.getElementById('cantidad');
    const totalSpan = document.getElementById('total');
    const btnComprar = document.getElementById('btnComprar');

    function actualizarResumen() {
      const seleccionados = document.querySelectorAll('input[name="asientosSeleccionados"]:checked').length;
      cantidadSpan.textContent = seleccionados;
      totalSpan.textContent = (seleccionados * precioUnitario).toFixed(2);
      btnComprar.disabled = seleccionados === 0;
    }

    document.querySelectorAll('input[name="asientosSeleccionados"]').forEach(input => {
      input.addEventListener('change', () => {
        const label = input.closest('label');
        const img = label.querySelector('img');
        const estadoOriginal = img.dataset.estado;

        if (input.checked) {
          img.src = '/images/seat-reservado.png';
        } else {
          let archivo = 'seat.png';
          if (estadoOriginal === 'reservado') {
            archivo = 'seat-reservado.png';
          } else if (estadoOriginal === 'no disponible') {
            archivo = 'seat-no-disponible.png';
          }
          img.src = '/images/' + archivo;
        }

        actualizarResumen();
      });
    });
  });
</script>

</body>
</html>
