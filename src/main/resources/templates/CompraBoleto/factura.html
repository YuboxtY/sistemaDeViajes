<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<header th:replace="~{layout/plantilla :: header}"></header>

<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center text-primary mb-4">Confirmar Pago del Boleto</h2>

    <form th:action="@{/CompraBoleto/realizarPago}" method="post" id="pagoForm">
        <div class="row justify-content-center">
            <div class="col-md-4">

                <!-- Tarjeta 1: Datos del usuario -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">Datos del Cliente</div>
                    <div class="card-body">
                        <p><strong>Cédula:</strong> <span th:text="${cliente.cedula}"></span></p>
                        <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
                        <p><strong>Apellido:</strong> <span th:text="${cliente.apellido}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${cliente.email}"></span></p>
                    </div>
                </div>

                <!-- Tarjeta 2: Resumen del boleto -->
                <div class="card mb-4">
                    <div class="card-header bg-secondary text-white">Resumen del Boleto</div>
                    <div class="card-body">
                        <p><strong>Origen:</strong> <span th:text="${turno.ruta.origen}"></span></p>
                        <p><strong>Destino:</strong> <span th:text="${turno.ruta.destino}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${turno.fecha}"></span></p>
                        <p><strong>Hora:</strong> <span th:text="${#temporals.format(turno.hora, 'hh:mm a')}"></span>
                        </p>
                        <hr>
                        <p><strong>Cantidad de Asientos:</strong> <span th:text="${asientos.size()}"></span></p>
                        <p><strong>Subtotal:</strong> $<span th:text="${subtotal}"></span></p>
                        <p><strong>IVA (15%):</strong> $<span th:text="${iva}"></span></p>
                        <h5><strong>Total:</strong> $<span th:text="${total}"></span></h5>
                    </div>
                </div>

                <!-- Tarjeta 3: Confirmar pago -->
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">Confirmar Pago</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="formaPago" class="form-label">Forma de Pago</label>
                            <select class="form-select" id="formaPago" name="formaPago" required>
                                <option value="">Seleccione una opción...</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Tarjeta">Tarjeta</option>
                                <option value="Transferencia">Transferencia</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="montoIngresado" class="form-label">Monto Ingresado</label>
                            <input type="number"
                                   class="form-control"
                                   id="montoIngresado"
                                   name="montoIngresado"
                                   step="0.01"
                                   th:attr="min=${total}"
                                   placeholder="Ingrese el valor pagado"
                                   required>
                            <div th:if="${errorPago}" class="alert alert-danger text-center">
                                <p th:text="${errorPago}"></p>
                            </div>
                        </div>


                        <!-- Datos necesarios del formulario -->
                        <!-- Datos necesarios del formulario -->
                        <input type="hidden" name="turnoId" th:value="${turno.id}"/>
                        <input type="hidden" name="cedula" th:value="${cliente.cedula}"/>
                        <input type="hidden" name="precioUnitario" th:value="${precioUnitario}"/>
                        <input type="hidden" name="subtotal" th:value="${subtotal}"/>
                        <input type="hidden" name="iva" th:value="${iva}"/>
                        <input type="hidden" name="total" th:value="${total}"/>
                        <input type="hidden" name="formaPago" th:value="${formaPago}"/>
                        <input type="hidden" name="montoIngresado" th:value="${montoIngresado}"/>

                        <!-- ✅ Aquí pasamos los IDs como string plano: 12,13,14 -->
                        <input type="hidden" name="asientosIds" th:value="${asientosIds}"/>

                    </div>
                </div>

                <!-- Botones -->
                <div class="text-center mb-4">
                    <button type="submit" class="btn btn-primary me-3">Pagar</button>
                    <a th:href="@{/CompraBoleto/listarTurnos}" class="btn btn-secondary">Regresar</a>
                </div>

            </div>
        </div>
    </form>
</div>

<!-- Validación JS -->
<script>
    document.getElementById("pagoForm").addEventListener("submit", function(e) {
        const total = parseFloat(document.getElementById("montoIngresado").getAttribute("min"));
        const ingresado = parseFloat(document.getElementById("montoIngresado").value);
        if (ingresado < total) {
            e.preventDefault();
            alert("El monto ingresado no puede ser menor al total a pagar: $" + total);
        }
    });
</script>
</body>
</html>
