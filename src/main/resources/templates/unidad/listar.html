<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Unidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Encabezado -->
    <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-primary"><i class="bi bi-bus-front-fill me-2"></i>Gestión de Unidades</h2>
            <a class="btn btn-success" th:href="@{/unidades/agregar}">
                <i class="bi bi-plus-circle"></i> Nueva Unidad
            </a>
        </div>
    </header>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla -->
    <main>
        <div th:if="${unidades != null and !unidades.empty}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>Placa</th>
                            <th>Modelo</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="unidad : ${unidades}">
                            <td th:text="${unidad.placa}"></td>
                            <td th:text="${unidad.modelo}"></td>
                            <td th:text="${unidad.capacidad}"></td>
                            <td th:text="${unidad.estado}"></td>
                            <td class="text-center">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{'/unidades/editar/' + ${unidad.placa}}" class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil-square"></i> Editar
                                    </a>
                                    <a th:href="@{'/unidades/eliminar/' + ${unidad.placa}}"
                                       class="btn btn-outline-danger btn-sm"
                                       th:onclick="'return confirm(\'¿Estás seguro de eliminar esta unidad?\')'">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- No hay datos -->
        <div th:if="${unidades == null or unidades.empty}">
            <div class="alert alert-info mt-4">No hay unidades registradas.</div>
        </div>

        <!-- Regresar -->
        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/}"><i class="bi bi-arrow-left"></i> Regresar al inicio</a>
        </div>
    </main>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
