<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Unidades</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .acciones-cell {
            width: 180px; /* Ancho fijo para la columna de acciones */
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-primary">Gestión de Unidades</h2>
            <a class="btn btn-primary" th:href="@{/unidades/agregar}">+ Agregar Nueva Unidad</a>
        </div>
    </header>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <main>
        <div th:if="${unidades != null and !unidades.empty}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>Placa</th>
                            <th>Modelo</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th class="text-center acciones-cell">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="unidad : ${unidades}">
                            <td th:text="${unidad.placa}"></td>
                            <td th:text="${unidad.modelo}"></td>
                            <td th:text="${unidad.capacidad}"></td>
                            <td th:text="${unidad.estado}"></td>
                            <td class="text-center acciones-cell">
                                <div class="d-flex gap-2 justify-content-center">
                                    <a th:href="@{'/unidades/editar/' + ${unidad.placa}}"
                                       class="btn btn-warning btn-sm">
                                        Editar
                                    </a>
                                    <a class="btn btn-outline-danger btn-sm"
                                       th:href="@{'/unidades/eliminar/' + ${unidad.placa}}"
                                       th:onclick="'return confirm(\'¿Estás seguro de eliminar esta unidad?\')'">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${unidades == null or unidades.empty}">
            <div class="alert alert-info mt-4">No hay unidades registradas.</div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/}">← Regresar al inicio</a>
        </div>
    </main>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
