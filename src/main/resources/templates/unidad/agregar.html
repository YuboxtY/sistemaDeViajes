<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${unidad.placa != null} ? 'Editar Unidad' : 'Agregar Unidad'">Formulario Unidad</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-center text-primary" th:text="${unidad.placa != null} ? 'Editar Unidad' : 'Agregar Unidad'">Formulario Unidad</h2>

    <form th:action="@{/unidades/guardar}" th:object="${unidad}" method="post" class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
        <!-- Campo oculto para edición -->
        <input type="hidden" th:if="${unidad.placa != null}" th:field="*{placa}" />

        <!-- Campo Placa (solo para agregar) -->
        <div class="mb-3" th:unless="${unidad.placa != null}">
            <label for="placa" class="form-label">Placa:</label>
            <input type="text" id="placa" class="form-control" th:field="*{placa}" required maxlength="10" />
        </div>

        <!-- Campo Modelo -->
        <div class="mb-3">
            <label for="modelo" class="form-label">Modelo:</label>
            <input type="text" id="modelo" class="form-control" th:field="*{modelo}" required />
        </div>

        <!-- Campo Capacidad -->
        <div class="mb-3">
            <label for="capacidad" class="form-label">Capacidad:</label>
            <input type="number" id="capacidad" class="form-control" th:field="*{capacidad}" required min="1" />
        </div>

        <!-- Campo Estado -->
        <div class="mb-3">
            <label for="estado" class="form-label">Estado:</label>
            <select id="estado" class="form-select" th:field="*{estado}" required>
                <option th:each="estado : ${T(SistemaDeViajes.sistema.Domain.Unidad.estadoUnidad).values()}"
                        th:value="${estado}"
                        th:text="${estado}">Estado</option>
            </select>
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/unidades/list}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
