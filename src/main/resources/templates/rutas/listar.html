<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Rutas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">
            <i class="bi bi-journal-richtext me-2"></i> Gestión de Rutas
        </h2>
        <a class="btn btn-success" th:href="@{/rutas/agregar}">
            <i class="bi bi-plus-circle"></i> Nueva Ruta
        </a>
    </div>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla de rutas -->
    <div th:if="${rutas != null and !rutas.empty}">
        <div class="card border-0 shadow-sm">
            <div class="card-body px-4">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ruta : ${rutas}">
                        <td th:text="${ruta.idRuta}"></td>
                        <td th:text="${ruta.origen}"></td>
                        <td th:text="${ruta.destino}"></td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{'/rutas/editar/' + ${ruta.idRuta}}" class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{'/rutas/eliminar/' + ${ruta.idRuta}}"
                                   class="btn btn-outline-danger btn-sm"
                                   th:onclick="'return confirm(\'¿Estás seguro de eliminar esta ruta?\')'">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sin rutas -->
    <div th:if="${rutas == null or rutas.empty}" class="alert alert-info mt-4">
        No hay rutas registradas.
    </div>

    <!-- Botón volver -->
    <div class="mt-4">
        <a class="btn btn-outline-primary" th:href="@{/}">
            <i class="bi bi-arrow-left"></i> Regresar al inicio
        </a>
    </div>

    <!-- Footer -->
    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
