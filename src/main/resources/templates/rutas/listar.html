<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Rutas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-primary">Gestión de Rutas</h2>
            <a class="btn btn-primary" th:href="@{/rutas/agregar}">+ Agregar Nueva Ruta</a>
        </div>
    </header>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <main>
        <div th:if="${rutas != null and !rutas.empty}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Horario</th>
                            <th>Unidades Asignadas</th>
                            <th>Asignar Unidad</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ruta : ${rutas}">
                            <td th:text="${ruta.idRuta}"></td>
                            <td th:text="${ruta.origen}"></td>
                            <td th:text="${ruta.destino}"></td>
                            <td th:text="${ruta.horario}"></td>
                            <td>
                                <div th:if="${!ruta.unidades.empty}">
                                    <div class="d-flex flex-column gap-1" th:each="unidad : ${ruta.unidades}">
                                        <div class="d-flex justify-content-between align-items-center bg-white border p-2 rounded shadow-sm">
                                            <span th:text="${unidad.placa} + ' - ' + ${unidad.modelo}"></span>
                                            <form th:action="@{'/rutas/liberar-unidad/' + ${ruta.idRuta}}" method="post">
                                                <input type="hidden" name="placaUnidad" th:value="${unidad.placa}">
                                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                                        th:onclick="'return confirm(\'¿Liberar esta unidad?\')'">
                                                    Liberar
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <span th:if="${ruta.unidades.empty}">Ninguna unidad asignada</span>
                            </td>
                            <td>
                                <form th:action="@{/rutas/asignar-unidad}" method="post" class="d-grid gap-2">
                                    <input type="hidden" name="idRuta" th:value="${ruta.idRuta}">
                                    <select class="form-select form-select-sm" name="placaUnidad">
                                        <option value="">Seleccione una unidad</option>
                                        <option th:each="unidad : ${unidadesDisponibles}"
                                                th:value="${unidad.placa}"
                                                th:text="${unidad.placa} + ' - ' + ${unidad.modelo}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-success btn-sm">Asignar</button>
                                </form>
                            </td>
                            <td>
                                <div class="d-flex flex-column gap-1">
                                    <a th:href="@{'/rutas/editar/' + ${ruta.idRuta}}"
                                       th:classappend="${ruta.unidades.empty} ? 'btn btn-warning btn-sm' : 'btn btn-secondary btn-sm disabled'"
                                       th:onclick="${ruta.unidades.empty} ? '' : 'alert(\'Debe liberar todas las unidades asignadas antes de editar\'); return false'">
                                        Editar
                                    </a>
                                    <a class="btn btn-outline-danger btn-sm"
                                       th:href="@{'/rutas/eliminar/' + ${ruta.idRuta}}"
                                       th:onclick="'return confirm(\'¿Estás seguro de eliminar esta ruta?\')'">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${rutas == null or rutas.empty}">
            <div class="alert alert-info mt-4">No hay rutas registradas.</div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/}">← Regresar al inicio</a>
        </div>
    </main>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
