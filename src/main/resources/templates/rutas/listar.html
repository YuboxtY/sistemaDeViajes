<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-primary">Gestión de Turnos</h2>
        </div>
    </header>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <main>
        <div th:if="${rutas != null and !rutas.empty}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Horario Base</th>
                            <th>Unidad</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Asignar Turno</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ruta : ${rutas}">
                            <form th:action="@{/turnos/asignar}" method="post">
                                <td th:text="${ruta.idRuta}">
                                    <input type="hidden" name="idRuta" th:value="${ruta.idRuta}" />
                                </td>
                                <td th:text="${ruta.origen}"></td>
                                <td th:text="${ruta.destino}"></td>
                                <td th:text="${ruta.horario}"></td>

                                <!-- Selección de unidad disponible -->
                                <td>
                                    <select class="form-select form-select-sm" name="placaUnidad" required>
                                        <option value="" disabled selected>Seleccione unidad</option>
                                        <option th:each="unidad : ${unidadesDisponibles}"
                                                th:value="${unidad.placa}"
                                                th:text="${unidad.placa + ' - ' + unidad.modelo}">
                                        </option>
                                    </select>
                                </td>

                                <!-- Fecha -->
                                <td>
                                    <input type="date" name="fecha" class="form-control form-control-sm" required />
                                </td>

                                <!-- Hora -->
                                <td>
                                    <input type="time" name="hora" class="form-control form-control-sm" required />
                                </td>

                                <!-- Botón enviar -->
                                <td>
                                    <button type="submit" class="btn btn-success btn-sm">Crear Turno</button>
                                </td>
                            </form>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${rutas == null or rutas.empty}">
            <div class="alert alert-info mt-4">No hay rutas registradas.</div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/}">← Regresar al inicio</a>
        </div>
    </main>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
