<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title th:text="${ruta.idRuta != null} ? 'Editar Ruta' : 'Agregar Ruta'">Formulario Ruta</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center text-primary" th:text="${ruta.idRuta != null} ? 'Editar Ruta' : 'Agregar Ruta'">Formulario Ruta</h2>

  <form th:action="@{/rutas/guardar}" th:object="${ruta}" method="post" class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
    <!-- Campo oculto para edición -->
    <input type="hidden" th:if="${ruta.idRuta != null}" th:field="*{idRuta}" />

    <!-- Campo Origen -->
    <div class="mb-3">
      <label for="origen" class="form-label">Origen:</label>
      <input type="text" id="origen" class="form-control" th:field="*{origen}" required />
    </div>

    <!-- Campo Destino -->
    <div class="mb-3">
      <label for="destino" class="form-label">Destino:</label>
      <input type="text" id="destino" class="form-control" th:field="*{destino}" required />
    </div>

    <!-- Campo Horario -->
    <div class="mb-3">
      <label for="horario" class="form-label">Horario:</label>
      <input type="text" id="horario" class="form-control" th:field="*{horario}" placeholder="Ej: 08:00 AM" required />
    </div>

    <!-- Botones -->
    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success">Guardar</button>
      <a th:href="@{/rutas/list}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
