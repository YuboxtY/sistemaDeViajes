<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Botones Agregar</title>
</head>
<body>
<section th:fragment="botonesCrearCuenta" class="py-4"> <!-- Botones para agregar cliente -->
    <div class="container"><!-- Contenedor principal de la sección -->
        <div class="row"><!-- Fila para los botones -->
            <div class="col-md-6 text"> <!-- Columna para el botón de agregar cliente -->
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agregarUsuario">
                    <i class="fas fa-plus"></i> [[#{accion.crearCuenta}]]<!-- Icono y texto del botón -->
                </a>
            </div>
        </div>
    </div>

</section>
</body>
</html>
