<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout/plantilla :: head"></head>

<body class="d-flex flex-column min-vh-100">
<header th:replace="layout/plantilla :: header"></header>

<div class="container mt-4">
    <h1 class="mb-4 border-bottom pb-2">Administrar Roles</h1>

    <!-- Barra de búsqueda -->
    <div class="toolbar mb-3">
        <form th:action="@{/gestionarUsuarios}" method="get" class="d-flex">
            <input type="text" name="termino" placeholder="Buscar por: Cédula o Nombre"
                   class="form-control me-2" th:value="${param.termino}" />
            <button type="submit" class="btn btn-aceptar">BUSCAR</button>
        </form>
    </div>

    <!-- Tabla de usuarios -->
    <div th:if="${usuarios != null and !usuarios.empty}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>#</th>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario, iterStat : ${usuarios}"
                th:classappend="${param.termino != null and
                               (usuario.cedula.contains(param.termino) or
                                usuario.nombre.contains(param.termino))} ? 'table-success'">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="${usuario.cedula}">0101010101</td>
                <td th:text="${usuario.nombre}">Juan</td>
                <td th:text="${usuario.apellido}">Perez</td>
                <td th:text="${usuario.email}">juan@ejemplo.com</td>
                <td>
                    <form th:action="@{/actualizarRol}" method="post" class="d-flex align-items-center">
                        <input type="hidden" name="usuarioId" th:value="${usuario.idUsuario}" />
                        <select name="rolId" class="form-select me-2">
                            <option value="1" th:selected="${usuario.rol?.idRol == 1}">Usuario</option>
                            <option value="2" th:selected="${usuario.rol?.idRol == 2}">Administrador</option>
                            <option value="3" th:selected="${usuario.rol?.idRol == 3}">Secretaria</option>
                            <option value="4" th:selected="${usuario.rol?.idRol == 4}">Chofer</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
                    </form>
                </td>
                <td>
                    <a th:href="@{/eliminarUsuario(idUsuario=${usuario.idUsuario})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p th:if="${param.termino != null}" class="text-success">
        Mostrando resultados para: <strong th:text="${param.termino}"></strong>
    </p>

    <div th:if="${usuarios == null or usuarios.empty}">
        <p class="text-muted">La lista de usuarios está vacía.</p>
    </div>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>
</body>
</html>
