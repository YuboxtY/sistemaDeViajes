<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar Roles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        .toolbar {
            margin-bottom: 20px;
        }

        .toolbar input, .toolbar button {
            margin-right: 10px;
            padding: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-editar {
            background-color: #2196F3;
            color: white;
        }

        .btn-eliminar {
            background-color: #f44336;
            color: white;
        }

        .btn-aceptar {
            background-color: #0d6efd;
            color: white;
            margin-left: 10px;
        }

        .btn-cancelar {
            background-color: #ccc;
            color: black;
        }

        .acciones {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<h1>Administrar Roles</h1>

<div class="toolbar">
    <input type="text" placeholder="Buscar por: Cédula o Nombre"/>
    <button class="btn btn-cancelar">CANCELAR</button>
    <button class="btn btn-aceptar">BUSCAR</button>
</div>

<div th:if="${usuarios != null and !usuarios.empty}">
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario, iterStat : ${usuarios}">
            <td th:text="${iterStat.index + 1}">1</td>
            <td th:text="${usuario.cedula}">0101010101</td>
            <td th:text="${usuario.nombre}">Juan</td>
            <td th:text="${usuario.apellido}">Perez</td>
            <td th:text="${usuario.email}">juan@ejemplo.com</td>
            <td class="acciones">
                <a th:href="@{/editarUsuario/{id}(id=${usuario.idUsuario})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/eliminarUsuario(idUsuario=${usuario.idUsuario})}" class="btn btn-eliminar">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:if="${usuarios == null or usuarios.empty}">
    <p>La lista de usuarios está vacía.</p>
</div>

<div style="margin-top: 20px;">
    <button class="btn btn-cancelar">CANCELAR</button>
    <button class="btn btn-aceptar">ACEPTAR</button>
</div>

</body>
</html>
