<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div th:fragment="FormularioCrearCuenta">
    <div class="container d-flex justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div class="text-left mb-3">
                <a th:href="@{/}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> [[#{accion.volver}]]
                </a>
            </div>

            <h2 class="text-center mb-4">[[#{accion.crearCuenta}]]</h2>
            <input type="hidden" th:field="*{idUsuario}"/>

            <!-- Nombre y Apellido -->
            <!-- Nombre y Apellido -->
            <div class="form-group mb-3">
                <div class="d-flex">
                    <div class="w-50 pr-2">
                        <label for="nombre">[[#{persona.nombre}]]</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required/>
                    </div>
                    <div class="w-50 pl-2">
                        <label for="apellido">[[#{persona.apellido}]]</label>
                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required/>
                    </div>
                </div>
            </div>

            <!-- Cédula -->
            <div class="form-group mb-3">
                <label for="cedula">[[#{persona.id}]]</label>
                <input type="text" id="cedula" th:field="*{cedula}" class="form-control" required/>
            </div>

            <!-- Email -->
            <div class="form-group mb-3">
                <label for="email">[[#{persona.email}]]</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required/>
            </div>

            <!-- Contraseña -->
            <div class="form-group mb-3">
                <label for="password">[[#{persona.password}]]</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required/>
            </div>

            <!-- Confirmar contraseña -->
            <div class="form-group mb-3">
                <label for="confirmPassword">[[#{persona.contrasenaConfirmacion}]]</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required/>
            </div>

            <!-- Términos -->
            <div class="form-group mb-4 text-center">
                <div class="form-check d-inline-block">
                    <input type="checkbox" id="terms" class="form-check-input" required/>
                    <label for="terms" class="form-check-label">[[#{persona.terminos}]]</label>
                </div>
            </div>

            <!-- Botón -->
            <div class="form-group text-center">
                <button type="submit" class="btn btn-primary px-5">[[#{accion.crearCuenta}]]</button>
            </div>


        </div>
    </div>
</div>
</body>
</html>
