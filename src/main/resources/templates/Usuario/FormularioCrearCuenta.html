<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div th:fragment="FormularioCrearCuenta">
    <div class="container">
        <div class="row p-3">
            <div class="col-md-3">
                <a th:href="@{/}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Regresar
                </a>
            </div>
        </div>
        <h2 class="text-center mb-4">Crear Cuenta de Usuario</h2>
        <input type="hidden" th:field="*{idUsuario}"/>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-4">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required/>
            </div>
            <div class="form-group col-md-4">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="cedula">Cédula/RUC</label>
                <input type="text" id="cedula" th:field="*{cedula}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group form-check col-md-7">
                <input type="checkbox" id="terms" class="form-check-input" required/>
                <label for="terms" class="form-check-label">Aceptar los Términos y Condiciones</label>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="text-center col-md-8">
                <button type="submit" class="btn btn-primary btn-block">CREAR CUENTA</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
