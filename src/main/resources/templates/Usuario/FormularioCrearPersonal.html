<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div th:fragment="FormularioCrearPersonal">
    <div class="container">
        <h2 class="text-center mb-4">Crear Cuenta del Personal</h2>

        <div class="form-row justify-content-start mb-3">
            <div class="col-md-3">
                <a th:href="@{/}" class="btn btn-secondary btn-block">
                    <i class="fas fa-arrow-left"></i> Regresar
                </a>
            </div>
        </div>

        <input type="hidden" th:field="*{idUsuario}"/>

        <div class="form-row justify-content-center">
            <div class="form-group col-md-4">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required/>
            </div>
            <div class="form-group col-md-4">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="cedula">Cédula/RUC</label>
                <input type="text" id="cedula" th:field="*{cedula}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required/>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group col-md-8">
                <label for="rol">Seleccionar Rol</label>
                <select id="rol" th:field="*{rol}" class="form-control" required>
                    <option value="" disabled selected>Seleccione un rol</option>
                    <option value="4">Chofer</option> <!-- ID del rol para Chofer -->
                    <option value="3">Secretaria</option>
                </select>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="form-group form-check col-md-8">
                <input type="checkbox" id="terms" class="form-check-input" required/>
                <label for="terms" class="form-check-label">Aceptar los Términos y Condiciones</label>
            </div>
        </div>

        <div class="form-row justify-content-center"> <!-- Añadido justify-content-center -->
            <div class="text-center col-md-8">
                <button type="submit" class="btn btn-primary btn-block">CREAR CUENTA</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
