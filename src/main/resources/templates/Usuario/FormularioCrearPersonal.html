<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta de Personal</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:fragment="FormularioCrearPersonal">
    <div class="container py-5">
        <!-- TÍTULO -->
        <h2 class="text-center text-primary mb-4">
            <i class="bi bi-person-plus-fill me-2"></i>Crear Cuenta del Personal
        </h2>

        <!-- BOTÓN REGRESAR -->
        <div class="row justify-content-start mb-4">
            <div class="col-md-3">
                <a th:href="@{/}" class="btn btn-outline-secondary btn-block">
                    <i class="bi bi-arrow-left"></i> Regresar
                </a>
            </div>
        </div>

        <!-- FORMULARIO -->
        <form>
            <input type="hidden" th:field="*{idUsuario}"/>

            <!-- Nombre y Apellido -->
            <div class="row justify-content-center">
                <div class="form-group col-md-4">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required />
                </div>
                <div class="form-group col-md-4">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required />
                </div>
            </div>

            <!-- Cédula -->
            <div class="row justify-content-center">
                <div class="form-group col-md-8">
                    <label for="cedula">Cédula/RUC</label>
                    <input type="text" id="cedula" th:field="*{cedula}" class="form-control" required />
                </div>
            </div>

            <!-- Email -->
            <div class="row justify-content-center">
                <div class="form-group col-md-8">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required />
                </div>
            </div>

            <!-- Rol -->
            <div class="row justify-content-center">
                <div class="form-group col-md-8">
                    <label for="rol">Seleccionar Rol</label>
                    <select id="rol" th:field="*{rol}" class="form-control" required>
                        <option value="" disabled selected>Seleccione un rol</option>
                        <option value="4">Chofer</option>
                        <option value="3">Secretaria</option>
                    </select>
                </div>
            </div>

            <!-- Términos -->
            <div class="row justify-content-center">
                <div class="form-group form-check col-md-8">
                    <input type="checkbox" id="terms" class="form-check-input" required />
                    <label class="form-check-label" for="terms">Aceptar los Términos y Condiciones</label>
                </div>
            </div>

            <!-- BOTÓN SUBMIT -->
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <button type="submit" class="btn btn-primary btn-block">CREAR CUENTA</button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
