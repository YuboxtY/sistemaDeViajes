<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
    <h2 class="text-center text-primary mb-4">Crear Turno</h2>

    <div class="mb-3">
        <a th:href="@{/turnos/gestionar}" class="btn btn-outline-primary">← Volver a gestión</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/turnos/guardarTurno}" method="post" class="vstack gap-3">

                <!-- Ruta -->
                <div>
                    <label class="form-label">Ruta (Origen - Destino)</label>
                    <select class="form-select" name="idRuta" required>
                        <option value="" disabled selected>Seleccione una ruta</option>
                        <option th:each="ruta : ${rutas}"
                                th:value="${ruta.idRuta}"
                                th:text="${ruta.origen + ' - ' + ruta.destino}">
                        </option>
                    </select>
                </div>

                <!-- Unidad -->
                <div>
                    <label class="form-label">Unidad</label>
                    <select class="form-select" name="placaUnidad" required>
                        <option value="" disabled selected>Seleccione unidad</option>
                        <option th:each="unidad : ${unidades}"
                                th:value="${unidad.placa}"
                                th:text="${unidad.placa + ' - ' + unidad.modelo}">
                        </option>
                    </select>
                </div>

                <!-- Fecha -->
                <div>
                    <label class="form-label">Fecha</label>
                    <input type="date" name="fecha" class="form-control" required />
                </div>

                <!-- Hora -->
                <div>
                    <label class="form-label">Hora</label>
                    <input type="time" name="hora" class="form-control" required />
                </div>

                <!-- Botón -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">Crear Turno</button>
                </div>
            </form>
        </div>
    </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
