<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<header th:replace="~{layout/plantilla :: header}"></header>

<div class="container py-4">
    <h4 class="text-center text-primary mb-4">Gestión de Turnos</h4>

    <div class="mb-3">
        <a th:href="@{/}" class="btn btn-outline-primary">← Volver al Menú</a>
    </div>
    <!-- Botón alineado a la derecha -->
    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/turnos/nuevo}" class="btn btn-primary">+ Crear nuevo turno</a>
    </div>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla de turnos -->
    <table class="table table-bordered table-hover bg-white">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Ruta (Origen - Destino)</th>
            <th>Unidad</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="turno : ${turnos}">
            <td th:text="${turno.id}">1</td>

            <!-- Ruta (solo lectura) -->
            <td>
                <span th:if="${turno.ruta != null}"
                      th:text="${turno.ruta.origen + ' - ' + turno.ruta.destino}">Origen - Destino</span>
                <span th:if="${turno.ruta == null}" class="text-danger">Sin ruta</span>
            </td>

            <!-- Unidad -->
            <td>
                <form th:action="@{/turnos/guardar}" method="post" class="d-flex gap-1 align-items-center">
                    <input type="hidden" name="id" th:value="${turno.id}"/>
                    <input type="hidden" name="rutaId" th:value="${turno.ruta.idRuta}"/>

                    <select class="form-select form-select-sm" name="placa" required>
                        <option th:each="unidad : ${unidades}" th:value="${unidad.placa}"
                                th:selected="${unidad.placa == turno.unidad.placa}"
                                th:text="${unidad.placa}">
                        </option>
                    </select>
            </td>

            <!-- Fecha -->
            <td>
                <input type="date" class="form-control form-control-sm" name="fecha"
                       th:value="${#temporals.format(turno.fecha, 'yyyy-MM-dd')}" required/>
            </td>

            <!-- Hora -->
            <td>
                <input type="time" class="form-control form-control-sm" name="hora"
                       th:value="${#temporals.format(turno.hora, 'HH:mm')}" required/>
            </td>

            <!-- Botones -->
            <td class="text-center d-flex gap-1 justify-content-center">
                <button type="submit" class="btn btn-success btn-sm">Guardar</button>
                </form>

                <form th:action="@{/turnos/eliminar}" method="post" th:object="${turno}">
                    <input type="hidden" name="id" th:value="${turno.id}"/>
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{layout/plantilla :: footer}"></footer>
</body>
</html>
