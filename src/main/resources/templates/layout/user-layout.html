<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(innerContent)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trans-Nabón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top" style="z-index:1050;">
  <div class="container px-4">
    <a class="navbar-brand d-flex align-items-center" th:href="@{/user-web/index}">
      <img th:src="@{/images/logo-trans-nabon.png}" alt="Trans-Nabón" height="45" class="me-2"/>
      <span class="fw-bold fs-5">Trans-Nabón</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link text-white" th:href="@{/user-web/index}"><i class="bi bi-house-door-fill me-1"></i>Inicio</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" id="servDropdown" role="button" data-bs-toggle="dropdown">Servicios</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/user-web/viajes}">Compra de boleto</a></li>
            <li><a class="dropdown-item" th:href="@{/user-web/historial}">Historial de Viajes</a></li>
            <li><a class="dropdown-item" th:href="@{/encomiendas/historial}">Historial de Encomiendas</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link text-white" th:href="@{/user-web/corporativo}">Servicios Corporativos</a></li>
        <li class="nav-item"><a class="nav-link text-white" th:href="@{/user-web/contacto}">Contáctanos</a></li>
      </ul>
      <div class="d-flex ms-lg-3 mt-3 mt-lg-0">
        <a class="btn btn-outline-light me-2" th:href="@{/user-web/perfil}"><i class="bi bi-person-circle me-1"></i>Mi Perfil</a>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-outline-light"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="flex-fill d-flex justify-content-center align-items-start py-5">
  <div class="container">
    <div class="bg-white rounded shadow-sm p-4">
      <div th:replace="${innerContent}"></div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
  <div class="container">
    <div class="small">© 2025 Trans-Nabón - Todos los derechos reservados</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
