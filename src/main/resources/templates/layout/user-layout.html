<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(innerContent)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trans-Nabón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top" style="z-index:1050">
  <div class="container-fluid px-4 d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center" th:href="@{/user-web/index}">
      <img th:src="@{/images/logo-trans-nabon.png}" alt="Trans-Nabón" height="50" style="display:block;"/>
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item ms-3"><a class="nav-link text-white" th:href="@{/user-web/index}">Inicio</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" id="servDropdown" role="button" data-bs-toggle="dropdown">Servicios</a>
          <ul class="dropdown-menu" aria-labelledby="servDropdown">
            <li><a class="dropdown-item" th:href="@{/user-web/viajes}">Reservar Viaje</a></li>
            <li><a class="dropdown-item" th:href="@{/user-web/historial}">Historial de Viajes</a></li>
            <li><a class="dropdown-item" th:href="@{/user-web/encomiendas}">Seguimiento Encomiendas</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link text-white" th:href="@{/user-web/corporativo}">Servicios Corporativos</a></li>
        <li class="nav-item"><a class="nav-link text-white" th:href="@{/user-web/contacto}">Contacto</a></li>
      </ul>
      <div class="d-flex">
        <a class="btn btn-outline-light me-2" th:href="@{/user-web/perfil}">Mi Perfil</a>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<main class="flex-fill bg-light py-4">
  <div class="container px-4">
    <div th:replace="${innerContent}"></div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  © 2025 Trans-Nabón
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
