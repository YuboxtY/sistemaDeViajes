<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trans-Nabón</title>

    <!-- Bootstrap + Iconos + Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            font-weight: 500;
        }

        .btn-orange {
            background-color: #ff6600;
            color: white;
            font-weight: bold;
            border-radius: 8px;
        }

        .btn-orange:hover {
            background-color: #cc5200;
        }
    </style>
</head>

<body>
<!-- HEADER / NAVBAR -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}" th:text="#{plantilla.titulo}">Trans-Nabón</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}" th:text="#{barra.titulo}">Inicio</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Cambio de idioma -->
                    <li class="nav-item me-3">
                        <div class="d-flex align-items-center gap-2 text-white small">
                            <span><i class="bi bi-translate"></i></span>
                            <a class="text-white text-decoration-none" th:href="@{/(lang=es)}">ES</a>
                            <span>|</span>
                            <a class="text-white text-decoration-none" th:href="@{/(lang=en)}">EN</a>
                        </div>
                    </li>

                    <!-- Usuario autenticado -->
                    <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                        <a class="nav-link">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="#{barra.bienvenido}">Bienvenido</span>,
                            <span sec:authentication="name">Usuario</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-light btn-sm">
                                <i class="fas fa-sign-out-alt me-1"></i> [[#{barra.salir}]]
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- FOOTER -->
<footer th:fragment="footer" class="bg-light text-center py-4 mt-auto">
    <div class="container d-flex justify-content-center align-items-center gap-2">
        <span class="fw-semibold">Empresa de Trasporte Quezada-Aguirre </span>
        <a href="https://www.facebook.com/profile.php?id=100009523177325&rdid=0CCa9PVum5NGLM4r&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1BzdJ21Eer%2F" target="_blank" rel="noopener noreferrer">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="30" height="30">
        </a>
    </div>
</footer>



</body>
</html>
