<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout/plantilla :: head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Viajes Trans-Nabón</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <style>
        .card-hover:hover {
            transform: scale(1.03);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:replace="layout/plantilla :: header"></header>

<!-- CONTENIDO PRINCIPAL -->
<div class="container my-5">
    <h1 class="text-center mb-4 text-primary fw-bold">
        <span th:text="#{bienvenida}"></span> <span class="text-dark">Trans-Nabón</span>
    </h1>
    <p class="text-center text-muted mb-5" th:text="#{subtitulo}"></p>

    <!-- Tarjetas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <!-- Unidad -->
        <div class="col">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-truck fs-1 text-primary mb-3"></i>
                <h5 class="fw-semibold" th:text="#{gestionar.unidades}"></h5>
                <p class="text-muted" th:text="#{descripcion.unidades}"></p>
                <a th:href="@{/unidades/list}" class="btn btn-outline-primary mt-auto">
                    <i class="bi bi-box-arrow-in-right me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

        <!-- Turnos -->
        <div class="col">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-geo-alt-fill fs-1 text-success mb-3"></i>
                <h5 class="fw-semibold" th:text="#{gestionar.turnos}"></h5>
                <p class="text-muted" th:text="#{descripcion.turnos}"></p>
                <a th:href="@{/turnos/gestionar}" class="btn btn-outline-success mt-auto">
                    <i class="bi bi-box-arrow-in-right me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

        <!-- Encomiendas -->
        <div class="col">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-box-fill fs-1 text-warning mb-3"></i>
                <h5 class="fw-semibold" th:text="#{gestionar.encomiendas}"></h5>
                <p class="text-muted" th:text="#{descripcion.encomiendas}"></p>
                <a th:href="@{/encomiendas/list}" class="btn btn-outline-warning text-dark mt-auto">
                    <i class="bi bi-box-arrow-in-right me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

        <!-- Rutas -->
        <div class="col">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-signpost-2-fill fs-1 text-info mb-3"></i>
                <h5 class="fw-semibold" th:text="#{gestionar.rutas}"></h5>
                <p class="text-muted" th:text="#{descripcion.rutas}"></p>
                <a th:href="@{/rutas/list}" class="btn btn-outline-info mt-auto">
                    <i class="bi bi-box-arrow-in-right me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

        <!-- Usuarios (solo admin) -->
        <div class="col" sec:authorize="hasRole('ROLE_ADMIN')">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-person-lines-fill fs-1 text-dark mb-3"></i>
                <h5 class="fw-semibold" th:text="#{crear.personal}"></h5>
                <p class="text-muted" th:text="#{descripcion.personal}"></p>
                <a th:href="@{/crearPersonal}" class="btn btn-dark mt-auto">
                    <i class="bi bi-person-plus-fill me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

        <!-- Roles (solo admin) -->
        <div class="col" sec:authorize="hasRole('ROLE_ADMIN')">
            <div class="card h-100 shadow-sm rounded-4 text-center card-hover p-4">
                <i class="bi bi-shield-lock-fill fs-1 text-secondary mb-3"></i>
                <h5 class="fw-semibold" th:text="#{gestionar.roles}"></h5>
                <p class="text-muted" th:text="#{descripcion.roles}"></p>
                <a th:href="@{/administrarRoles}" class="btn btn-outline-secondary mt-auto">
                    <i class="bi bi-shield-check me-1"></i> <span th:text="#{acceder}"></span>
                </a>
            </div>
        </div>

    </div>
</div>

<footer th:replace="layout/plantilla :: footer"></footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
