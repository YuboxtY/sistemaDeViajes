<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Viajes Trans-Nabon</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Contenedor principal -->
<div class="container text-center my-5">
    <h1 class="mb-4 text-primary">Bienvenido al Sistema de Viajes <span class="fw-bold">Trans-Nabon</span></h1>

    <div class="row justify-content-center g-3">
        <div class="col-12 col-md-4">
            <a class="btn btn-outline-primary btn-lg w-100" th:href="@{/unidades/list}">
                Gestionar Unidades
            </a>
        </div>
        <div class="col-12 col-md-4">
            <a class="btn btn-outline-success btn-lg w-100" th:href="@{/rutas/list}">
                Gestionar Rutas
            </a>
        </div>

    </div>
    <div class="row justify-content-center g-3 mt-3">
        <div class="col-12 col-md-4">
            <a class="btn btn-outline-secondary btn-lg w-100" th:href="@{/agregarUsuario}">
                Crear Usuario
            </a>
        </div>
        <div class="col-12 col-md-4">
            <a class="btn btn-outline-warning btn-lg w-100" th:href="@{/administrarRoles}">
                Gestionar Roles
            </a>
        </div>
    </div>

</div>

<!-- Footer -->
<footer class="text-center mt-auto py-3 text-muted">
    <p>© 2025 Sistema de Viajes Trans-Nabon</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
