<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="layout/plantilla :: head">
    <title>Login</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .btn-login {
            padding: 12px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<header th:replace="layout/plantilla :: header"></header>
<section id="actions" class="py-4 mb-4 bg-light">
    <div class="container">
        <div class="row">
        </div>
    </div>
</section>


<div class="container mt-3">
    <div class="d-flex justify-content-end">
        <a th:href="@{/crearCuenta}" class="btn btn-primary">
            <i class="fas fa-user-plus"></i> Agregar Cuenta
        </a>
    </div>
</div>

<section id="login">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center py-3">
                        <h4 class="mb-0">[[#{accion.ingresar}]]</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" th:action="@{/login}">
                            <div class="form-group">
                                <label for="username" class="form-label fw-bold">[[#{persona.username}]]:</label>
                                <input type="text" name="username" id="username" class="form-control form-control-lg"
                                       required>
                                <div class="mt-2"></div> <!-- Espaciado adicional -->
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label fw-bold">[[#{persona.password}]]:</label>
                                <input type="password" name="password" id="password"
                                       class="form-control form-control-lg"
                                       autocomplete="off" required>
                                <div class="mt-3"></div> <!-- Espaciado adicional -->
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-login">INICIAR SESIÓN</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<footer th:replace="layout/plantilla::footer"></footer>
</body>

</html>
