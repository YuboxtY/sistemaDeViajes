<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="layout/user-layout :: layout(~{::content})">
<div th:fragment="content" class="text-center py-5">
    <div class="container">
        <!-- Imagen ilustrativa  -->
        <img src="/images/404-bus.png"
             alt="Autobús no encontrado"
             class="img-fluid mb-4"
             style="max-width: 300px;"/>


        <!-- Código de error -->
        <p class="fs-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Página no encontrada
        </p>
        <p class="lead mb-4">
            Lo sentimos, la URL que buscas no existe o fue movida.
        </p>

        <!-- Botones de acción -->
        <a class="btn btn-primary btn-lg me-2" th:href="@{/user-web/index}">
            <i class="bi bi-house"></i> Volver al inicio
        </a>
        <a class="btn btn-outline-secondary btn-lg" th:href="@{/user-web/contacto}">
            <i class="bi bi-envelope"></i> Contáctanos
        </a>
    </div>
</div>
</html>
