<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Encomienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <h2 class="text-primary">Formulario de Encomienda</h2>
    </header>

    <form th:action="@{/encomiendas/guardar}" method="get" th:object="${encomienda}" class="card shadow-sm p-4 bg-white">

        <!-- ID oculto -->
        <input type="hidden" th:field="*{idEncomienda}"/>

        <div class="mb-3">
            <label class="form-label">Número de Envío</label>
            <input type="text" th:field="*{numeroDeEnvio}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Remitente</label>
            <input type="text" th:field="*{remitente.nombre}" class="form-control" placeholder="Nombre del remitente" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Destinatario</label>
            <input type="text" th:field="*{destinatario.nombre}" class="form-control" placeholder="Nombre del destinatario" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Envío</label>
            <input type="datetime-local" th:field="*{fechaEnvio}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <input type="text" th:field="*{tipo}" class="form-control" placeholder="Ej: Paquete, Sobre, Caja" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio Base</label>
            <input type="number" step="0.01" th:field="*{precioBase}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Total</label>
            <input type="number" step="0.01" th:field="*{total}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <input type="text" th:field="*{estado}" class="form-control" placeholder="Ej: Pendiente, En tránsito, Entregado"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Factura</label>
            <input type="datetime-local" th:field="*{fechaFactura}" class="form-control"/>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" th:field="*{pagado}" id="pagado"/>
            <label class="form-check-label" for="pagado">Pagado</label>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/encomiendas/list}" class="btn btn-outline-secondary">← Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Encomienda</button>
        </div>
    </form>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
