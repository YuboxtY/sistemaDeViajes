<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Encomienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- ENCABEZADO -->
    <header class="mb-5 text-center">
        <h2 class="text-primary fw-bold"><i class="bi bi-box2-heart me-2"></i>Formulario de Encomienda</h2>
        <p class="text-muted">Completa los campos para registrar una nueva encomienda</p>
    </header>

    <!-- FORMULARIO -->
    <form th:action="@{/encomiendas/guardar}" th:object="${encomienda}" method="post">
        <input type="hidden" th:field="*{idEncomienda}" />
        <div class="mb-4">
            <label class="form-label fw-semibold">Número de Envío</label>
            <input type="text" th:field="*{numeroDeEnvio}" class="form-control" readonly />
        </div>

        <!-- REMITENTE Y DESTINATARIO -->
        <div class="row g-4">
            <!-- Remitente -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">Remitente</div>
                    <div class="card-body">
                        <input type="hidden" th:field="*{remitente.idCliente}" />
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Cédula</label>
                                <div class="input-group">
                                    <input type="text" id="remitenteCedula" th:field="*{remitente.cedula}" class="form-control" required />
                                    <button type="button" class="btn btn-outline-secondary" onclick="buscarCliente('remitente')">Buscar</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombres</label>
                                <input type="text" id="remitenteNombre" th:field="*{remitente.nombre}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" id="remitenteApellido" th:field="*{remitente.apellido}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" id="remitenteTelefono" th:field="*{remitente.telefono}" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo</label>
                                <input type="email" id="remitenteCorreo" th:field="*{remitente.correo}" class="form-control" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Destinatario -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">Destinatario</div>
                    <div class="card-body">
                        <input type="hidden" th:field="*{destinatario.idCliente}" />
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Cédula</label>
                                <div class="input-group">
                                    <input type="text" id="destinatarioCedula" th:field="*{destinatario.cedula}" class="form-control" required />
                                    <button type="button" class="btn btn-outline-secondary" onclick="buscarCliente('destinatario')">Buscar</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombres</label>
                                <input type="text" id="destinatarioNombre" th:field="*{destinatario.nombre}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" id="destinatarioApellido" th:field="*{destinatario.apellido}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" id="destinatarioTelefono" th:field="*{destinatario.telefono}" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo</label>
                                <input type="email" id="destinatarioCorreo" th:field="*{destinatario.correo}" class="form-control" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- INFORMACIÓN DE ENVÍO -->
        <div class="card my-4 shadow-sm">
            <div class="card-header bg-secondary text-white">Información de Envío</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Fecha de Envío</label>
                        <input type="datetime-local" th:field="*{fechaEnvio}" class="form-control" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Envío</label>
                        <input type="text" th:field="*{tipo}" class="form-control" placeholder="Ej: Paquete" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select th:field="*{estado}" class="form-select" required>
                            <option th:each="e : ${T(SistemaDeViajes.sistema.Domain.Encomienda.EstadoEncomienda).values()}"
                                    th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGO Y FACTURACIÓN -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-secondary text-white">Pago y Facturación</div>
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Método de Pago</label>
                        <select th:field="*{metodoPago}" class="form-select" required>
                            <option th:each="m : ${T(SistemaDeViajes.sistema.Domain.Encomienda.MetodoPago).values()}"
                                    th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Precio Subtotal</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" th:field="*{precioSubtotal}" class="form-control" required />
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">IVA (12%)</label>
                        <p class="form-control-plaintext" th:text="${encomienda.iva}"></p>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Total</label>
                        <p class="form-control-plaintext fw-bold" th:text="${encomienda.total}"></p>
                    </div>
                </div>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="pagado" th:field="*{pagado}" />
                    <label class="form-check-label" for="pagado">Pagado</label>
                </div>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="d-flex justify-content-between mb-5">
            <a th:href="@{/encomiendas/list}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i> Guardar Encomienda
            </button>
        </div>
    </form>

    <!-- FOOTER -->
    <footer class="mt-5 text-center text-muted small">
        © 2025 Sistema de Viajes
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function buscarCliente(tipo) {
        const cedula = document.getElementById(tipo + 'Cedula').value;
        if (!cedula) {
            alert("Por favor ingresa una cédula");
            return;
        }

        fetch(`/clientes/buscar?cedula=${cedula}`)
            .then(response => response.ok ? response.json() : null)
            .then(cliente => {
                if (cliente) {
                    document.getElementById(tipo + 'Nombre').value = cliente.nombre || '';
                    document.getElementById(tipo + 'Apellido').value = cliente.apellido || '';
                    document.getElementById(tipo + 'Telefono').value = cliente.telefono || '';
                    document.getElementById(tipo + 'Correo').value = cliente.correo || '';
                } else {
                    limpiarCampos(tipo);
                }
            })
            .catch(() => {
                alert("Error al buscar cliente.");
                limpiarCampos(tipo);
            });
    }

    function limpiarCampos(tipo) {
        ['Nombre', 'Apellido', 'Telefono', 'Correo'].forEach(campo => {
            document.getElementById(tipo + campo).value = '';
        });
    }
</script>
</body>
</html>
