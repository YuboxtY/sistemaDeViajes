<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Encomiendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">
            <i class="bi bi-box-seam me-2"></i> Gestión de Encomiendas
        </h2>
        <a class="btn btn-success" th:href="@{/encomiendas/agregar}">
            <i class="bi bi-plus-circle"></i> Nueva Encomienda
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla de Encomiendas -->
    <div th:if="${encomiendas != null and !encomiendas.empty}">
        <div class="card border-0 shadow-sm">
            <div class="card-body px-4">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>N° Envío</th>
                        <th>Remitente</th>
                        <th>Destinatario</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="encomienda : ${encomiendas}">
                        <td th:text="${encomienda.idEncomienda}"></td>
                        <td th:text="${encomienda.numeroDeEnvio}"></td>
                        <td th:text="${encomienda.remitente.nombre} + ' ' + ${encomienda.remitente.apellido}"></td>
                        <td th:text="${encomienda.destinatario.nombre} + ' ' + ${encomienda.destinatario.apellido}"></td>
                        <td th:text="${#temporals.format(encomienda.fechaEnvio,'dd/MM/yyyy')}"></td>
                        <td th:text="${encomienda.tipo}"></td>
                        <td th:text="${encomienda.estado}"></td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{'/encomiendas/editar/' + ${encomienda.idEncomienda}}" class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{'/encomiendas/eliminar/' + ${encomienda.idEncomienda}}"
                                   class="btn btn-outline-danger btn-sm"
                                   th:onclick="'return confirm(\'¿Estás seguro de eliminar esta encomienda?\')'">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                                <a th:href="@{'/encomiendas/factura/' + ${encomienda.idEncomienda}}" class="btn btn-info btn-sm">
                                    <i class="bi bi-receipt"></i> Factura
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sin encomiendas -->
    <div th:if="${encomiendas == null or encomiendas.empty}" class="alert alert-info mt-4">
        No hay encomiendas registradas.
    </div>

    <!-- Botón volver -->
    <div class="mt-4">
        <a class="btn btn-outline-primary" th:href="@{/}">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>

    <!-- Footer -->
    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
