<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Encomiendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="text-primary">Gestión de Encomiendas</h2>
            <a class="btn btn-primary" th:href="@{/encomiendas/agregar}">+ Nueva Encomienda</a>
        </div>
    </header>

    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <main>
        <div th:if="${encomiendas != null and !encomiendas.empty}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>N° Envío</th>
                            <th>Remitente</th>
                            <th>Destinatario</th>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="encomienda : ${encomiendas}">
                            <td th:text="${encomienda.idEncomienda}"></td>
                            <td th:text="${encomienda.numeroDeEnvio}"></td>
                            <td th:text="${encomienda.remitente.nombre} + ' ' + ${encomienda.remitente.apellido}"></td>
                            <td th:text="${encomienda.destinatario.nombre} + ' ' + ${encomienda.destinatario.apellido}"></td>
                            <td th:text="${#temporals.format(encomienda.fechaEnvio,'dd/MM/yyyy')}"></td>
                            <td th:text="${encomienda.tipo}"></td>
                            <td th:text="${encomienda.estado}"></td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{'/encomiendas/editar/' + ${encomienda.idEncomienda}}"
                                       class="btn btn-warning btn-sm">Editar</a>
                                    <a th:href="@{'/encomiendas/eliminar/' + ${encomienda.idEncomienda}}"
                                       class="btn btn-outline-danger btn-sm"
                                       th:onclick="'return confirm(\'¿Estás seguro de eliminar esta encomienda?\')'">
                                        Eliminar
                                    </a>
                                    <!-- Botón Factura -->
                                    <a th:href="@{'/encomiendas/factura/' + ${encomienda.idEncomienda}}"
                                       class="btn btn-info btn-sm">
                                        Factura
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${encomiendas == null or encomiendas.empty}">
            <div class="alert alert-info mt-4">No hay encomiendas registradas.</div>
        </div>

        <div class="mt-4">
            <a class="btn btn-outline-primary" th:href="@{/}">← Volver al inicio</a>
        </div>
    </main>

    <footer class="mt-5 text-center text-muted">
        <p>© 2025 Sistema de Viajes</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
