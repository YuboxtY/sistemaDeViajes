<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Factura - Encomienda [[${encomienda.numeroDeEnvio}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        @media print {
          .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-white py-4">
<div class="container border p-4">
    <!-- Header con logo y título -->
    <div class="row align-items-center mb-4">
        <div class="col-2">
            <img th:src="@{/images/logo-trans-nabon.png}"
                 alt="Logo Trans Nabón"
                 width="140"
                 height="auto"/>
        </div>
        <div class="col-10 text-end">
            <h3 class="mb-1">Factura de Envío</h3>
            <p class="mb-0">N° Envío: <strong th:text="${encomienda.numeroDeEnvio}"></strong></p>
        </div>
    </div>

    <!-- Datos del Remitente y Destinatario -->
    <div class="row mb-4">
        <div class="col-md-6">
            <h5>Remitente</h5>
            <table class="table table-borderless">
                <tr>
                    <th class="p-1 text-end">Nombre:</th>
                    <td class="p-1"
                        th:text="${encomienda.remitente.nombre} + ' ' + ${encomienda.remitente.apellido}"></td>
                </tr>
                <tr>
                    <th class="p-1 text-end">Cédula:</th>
                    <td class="p-1" th:text="${encomienda.remitente.cedula}"></td>
                </tr>
                <tr th:if="${encomienda.remitente.correo}">
                    <th class="p-1 text-end">Correo:</th>
                    <td class="p-1" th:text="${encomienda.remitente.correo}"></td>
                </tr>
                <tr th:if="${encomienda.remitente.telefono}">
                    <th class="p-1 text-end">Teléfono:</th>
                    <td class="p-1" th:text="${encomienda.remitente.telefono}"></td>
                </tr>
            </table>
        </div>
        <div class="col-md-6">
            <h5>Destinatario</h5>
            <table class="table table-borderless">
                <tr>
                    <th class="p-1 text-end">Nombre:</th>
                    <td class="p-1"
                        th:text="${encomienda.destinatario.nombre} + ' ' + ${encomienda.destinatario.apellido}"></td>
                </tr>
                <tr>
                    <th class="p-1 text-end">Cédula:</th>
                    <td class="p-1" th:text="${encomienda.destinatario.cedula}"></td>
                </tr>
                <tr th:if="${encomienda.destinatario.correo}">
                    <th class="p-1 text-end">Correo:</th>
                    <td class="p-1" th:text="${encomienda.destinatario.correo}"></td>
                </tr>
                <tr th:if="${encomienda.destinatario.telefono}">
                    <th class="p-1 text-end">Teléfono:</th>
                    <td class="p-1" th:text="${encomienda.destinatario.telefono}"></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Información del Envío -->
    <div class="mb-4">
        <h5>Información del Envío</h5>
        <table class="table table-sm">
            <tr>
                <th>Fecha:</th>
                <td th:text="${#temporals.format(encomienda.fechaEnvio, 'dd/MM/yyyy')}"></td>
            </tr>
            <tr>
                <th>Tipo:</th>
                <td th:text="${encomienda.tipo}"></td>
            </tr>
            <tr>
                <th>Estado:</th>
                <td th:text="${encomienda.estado}"></td>
            </tr>
            <tr th:if="${encomienda.descripcion}">
                <th>Descripción:</th>
                <td th:text="${encomienda.descripcion}"></td>
            </tr>
        </table>
    </div>

    <!-- Detalle de Pago -->
    <div class="mb-4">
        <h5>Detalle de Pago</h5>
        <table class="table table-sm">
            <thead class="table-light">
            <tr>
                <th class="text-center">Subtotal</th>
                <th class="text-center">IVA (12%)</th>
                <th class="text-center">Total</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td class="text-center" th:text="${encomienda.precioSubtotal}">0.00</td>
                <td class="text-center" th:text="${encomienda.iva}">0.00</td>
                <td class="text-center" th:text="${encomienda.total}">0.00</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th class="text-end">Método de Pago:</th>
                <td colspan="2" th:text="${encomienda.metodoPago}">EFECTIVO</td>
            </tr>
            <tr>
                <th class="text-end">Pagado:</th>
                <td colspan="2" th:text="${encomienda.pagado} ? 'Sí' : 'No'">Sí</td>
            </tr>
            </tfoot>
        </table>
    </div>

    <!-- Botones -->
    <div class="text-end no-print">
        <a class="btn btn-secondary me-2" th:href="@{/encomiendas/list}">Cancelar</a>
        <button class="btn btn-primary" onclick="window.print()">
            <i class="bi bi-printer"></i> Imprimir Factura
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
